<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="768" height="512" viewBox="0 0 768 512">
  <!--
    One building block. Godot BoxMesh UV layout (3x2 grid, one 256px cell per face):
      row 0: +Z | +X | -Z     (walls)
      row 1: -X | +Y roof | -Y underside
    Walls are near-white so each building's albedo_color tints them.
  -->
  <defs>
    <g id="wall">
      <rect width="256" height="256" fill="#f2f2f2"/>
      <rect x="32" y="56" width="80" height="120" rx="6" fill="#2b3a55" stroke="#8a8a8a" stroke-width="8"/>
      <rect x="144" y="56" width="80" height="120" rx="6" fill="#2b3a55" stroke="#8a8a8a" stroke-width="8"/>
      <line x1="72" y1="56" x2="72" y2="176" stroke="#8a8a8a" stroke-width="5"/>
      <line x1="184" y1="56" x2="184" y2="176" stroke="#8a8a8a" stroke-width="5"/>
      <rect y="236" width="256" height="20" fill="#bdbdbd"/>
      <rect width="256" height="256" fill="none" stroke="#9e9e9e" stroke-width="4"/>
    </g>
  </defs>
  <use xlink:href="#wall" x="0" y="0"/>
  <use xlink:href="#wall" x="256" y="0"/>
  <use xlink:href="#wall" x="512" y="0"/>
  <use xlink:href="#wall" x="0" y="256"/>
  <!-- roof -->
  <rect x="256" y="256" width="256" height="256" fill="#9e9e9e"/>
  <rect x="268" y="268" width="232" height="232" fill="none" stroke="#7a7a7a" stroke-width="10"/>
  <!-- underside -->
  <rect x="512" y="256" width="256" height="256" fill="#6e6e6e"/>
</svg>
